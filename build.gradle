plugins {
	id 'java'
	id 'checkstyle'
	id 'application'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.toru_otsuki'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.palantir.javapoet:javapoet:0.22.0'
	implementation 'org.glassfish.corba:idlj:5.0.3'
	testImplementation 'com.fasterxml.jackson.core:jackson-annotations:2.21'
	testImplementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.55'
	testImplementation 'org.glassfish.corba:glassfish-corba-omgapi:5.0.3'
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.springdoc:springdoc-openapi-starter-common:3.1.1'
	testImplementation 'org.springframework:spring-context:7.0.10'
	testImplementation 'org.springframework:spring-web:7.0.10'
	testImplementation 'tools.jackson.core:jackson-databind:3.1.7'
	testImplementation platform('org.junit:junit-bom:6.1.3')
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()

	// `./gradlew test -Dgolden.update=true`でゴールデンファイルを更新する
	systemProperty 'golden.update', System.getProperty('golden.update', 'false')
}

// 生成先にGradleWrapperをコピーする
processResources {
	from(files('gradlew', 'gradlew.bat')) {
		into 'project-wrapper'
	}
	from('gradle/wrapper') {
		into 'project-wrapper/gradle/wrapper'
	}
}

application {
	mainClass = 'com.toru_otsuki.bridge_generator.Main'
}

spotless {
	java {
		googleJavaFormat('1.36.1')
		target 'src/**/*.java'
		targetExclude 'src/test/resources/**'
		importOrder()
		removeUnusedImports()
	}
}

checkstyle {
	toolVersion = '14.4.0'
}
